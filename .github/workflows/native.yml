name: Native checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DYUCA_ENABLE_SANITIZERS=${{ matrix.sanitizers }} -DYUCA_BUILD_BENCHMARKS=ON -DYUCA_BUILD_PROFILING=${{ matrix.sanitizers == 'OFF' && 'ON' || 'OFF' }} -DYUCA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci --output-on-failure
      - name: Benchmark artifact (informational, no timing threshold)
        if: matrix.sanitizers == 'OFF'
        run: |
          git rev-parse HEAD > build/ci/environment.txt
          uname -a >> build/ci/environment.txt
          c++ --version >> build/ci/environment.txt
          build/ci/yuca_benchmarks 7 1000 > build/ci/benchmarks.csv
          build/ci/yuca_allocations index 1000 1 > build/ci/allocations.jsonl
          build/ci/yuca_allocations search_top10 1000 100 >> build/ci/allocations.jsonl
          python3 scripts/benchmark_suite.py --candidate build/ci/yuca_benchmark_suite --documents 100,1000 --workloads index,remove,search_common,search_rare --top-k 0,10 --samples 3 --min-sample-ms 1 --max-iterations 20 --output build/ci/scaling
          build/ci/yuca_snapshot_benchmark 1000 build/ci/disposable-benchmark.yuca > build/ci/snapshots.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: benchmark-artifact
        if: matrix.sanitizers == 'OFF'
        with:
          name: release-benchmarks
          path: |
            build/ci/benchmarks.csv
            build/ci/environment.txt
            build/ci/allocations.jsonl
            build/ci/snapshots.csv
            build/ci/scaling/
      - name: Release benchmark summary
        if: always() && matrix.sanitizers == 'OFF'
        env:
          ARTIFACT_URL: ${{ steps.benchmark-artifact.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_summary.py benchmarks build/ci >> "$GITHUB_STEP_SUMMARY"

  linux-compilers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure strict C++11 core and full unit tests
        run: cmake -S . -B build/ci -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DYUCA_WARNINGS_AS_ERRORS=ON -DYUCA_BUILD_BENCHMARKS=ON -DYUCA_BUILD_PROFILING=ON
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Check workflow runtime policy
        run: |
          python3 tests/test_native_workflow.py
          python3 tests/test_ci_summary.py
      - name: Configure
        run: cmake -S . -B build/analysis -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYUCA_ENABLE_CLANG_TIDY=ON -DYUCA_WARNINGS_AS_ERRORS=ON
      - name: Build with blocking analysis
        run: cmake --build build/analysis --parallel 4
      - name: Test analyzer gate and library
        run: ctest --test-dir build/analysis --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install matching coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Configure source and branch coverage
        run: cmake -S . -B build/coverage -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DYUCA_ENABLE_COVERAGE=ON -DYUCA_WARNINGS_AS_ERRORS=ON -DYUCA_LLVM_COV=/usr/bin/llvm-cov-18 -DYUCA_LLVM_PROFDATA=/usr/bin/llvm-profdata-18
      - name: Build, test, and report core-only coverage
        run: cmake --build build/coverage --target coverage --parallel 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: coverage-artifact
        if: always()
        with:
          name: core-coverage
          path: build/coverage/coverage/
      - name: Coverage summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_summary.py coverage build/coverage/coverage >> "$GITHUB_STEP_SUMMARY"

  linux-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure instrumented library and fuzzers
        run: cmake -S . -B build/fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYUCA_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF -DYUCA_BUILD_DEMOS=OFF
      - name: Build
        run: cmake --build build/fuzz --parallel 4
      - name: Replay and mutate all corpora
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p build/fuzz/corpus
          cp -R fuzz/corpus/utils build/fuzz/corpus/
          cp -R fuzz/corpus/indexer build/fuzz/corpus/
          cp -R fuzz/corpus/snapshot build/fuzz/corpus/
          build/fuzz/yuca_fuzz_utils build/fuzz/corpus/utils -runs=10000 -seed=444 -max_len=512 -timeout=5 -rss_limit_mb=1024
          build/fuzz/yuca_fuzz_indexer build/fuzz/corpus/indexer -runs=10000 -seed=444 -max_len=512 -timeout=5 -rss_limit_mb=1024
          build/fuzz/yuca_fuzz_snapshot build/fuzz/corpus/snapshot -runs=10000 -seed=444 -max_len=512 -timeout=5 -rss_limit_mb=1024
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failure-artifacts
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
            build/fuzz/corpus/
