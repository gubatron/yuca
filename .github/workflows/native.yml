name: Native checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DYUCA_ENABLE_SANITIZERS=${{ matrix.sanitizers }} -DYUCA_BUILD_BENCHMARKS=ON -DYUCA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci --output-on-failure
      - name: Benchmark artifact (informational, no timing threshold)
        if: matrix.sanitizers == 'OFF'
        run: |
          git rev-parse HEAD > build/ci/environment.txt
          uname -a >> build/ci/environment.txt
          c++ --version >> build/ci/environment.txt
          build/ci/yuca_benchmarks 7 1000 > build/ci/benchmarks.csv
      - uses: actions/upload-artifact@v4
        if: matrix.sanitizers == 'OFF'
        with:
          name: release-benchmarks
          path: |
            build/ci/benchmarks.csv
            build/ci/environment.txt

  linux-compilers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C++11 core and full unit tests
        run: cmake -S . -B build/ci -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DYUCA_WARNINGS_AS_ERRORS=ON -DYUCA_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure
        run: cmake -S . -B build/analysis -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYUCA_ENABLE_CLANG_TIDY=ON -DYUCA_WARNINGS_AS_ERRORS=ON
      - name: Build with blocking analysis
        run: cmake --build build/analysis --parallel 4
      - name: Test analyzer gate and library
        run: ctest --test-dir build/analysis --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install matching coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Configure source and branch coverage
        run: cmake -S . -B build/coverage -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DYUCA_ENABLE_COVERAGE=ON -DYUCA_WARNINGS_AS_ERRORS=ON -DYUCA_LLVM_COV=/usr/bin/llvm-cov-18 -DYUCA_LLVM_PROFDATA=/usr/bin/llvm-profdata-18
      - name: Build, test, and report core-only coverage
        run: cmake --build build/coverage --target coverage --parallel 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: build/coverage/coverage/

  linux-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented library and fuzzers
        run: cmake -S . -B build/fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYUCA_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF -DYUCA_BUILD_DEMOS=OFF
      - name: Build
        run: cmake --build build/fuzz --parallel 4
      - name: Replay and mutate both corpora
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p build/fuzz/corpus
          cp -R fuzz/corpus/utils build/fuzz/corpus/
          cp -R fuzz/corpus/indexer build/fuzz/corpus/
          build/fuzz/yuca_fuzz_utils build/fuzz/corpus/utils -runs=10000 -seed=444 -max_len=512 -timeout=5 -rss_limit_mb=1024
          build/fuzz/yuca_fuzz_indexer build/fuzz/corpus/indexer -runs=10000 -seed=444 -max_len=512 -timeout=5 -rss_limit_mb=1024
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failure-artifacts
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
            build/fuzz/corpus/
